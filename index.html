<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control d'Assistència — EASD Llotja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Aquí s'enganxa el contingut que tens dins del <body> de l'Index.html -->
  <div class="app-container">
     
      <!-- Capçalera i selecció de mode -->
      <div class="header">
        <h2>Control d'Assistència</h2>
        <div class="view-toggle">
          <button type="button" id="btnModeRegistrar" class="toggle-btn active">Registrar Classe (Avui)</button>
          <button type="button" id="btnModeModificar" class="toggle-btn">Registres Anteriors</button>
        </div>
      </div>

      <!-- Formulari de Selecció -->
      <div class="form-card">
        
        <!-- Només visible o editable segons el mode triat -->
        <div class="form-group" id="containerData">
          <label for="inputData">Data:</label>
          <input type="date" id="inputData" class="form-control">
        </div>

        <div class="form-group">
          <label for="selectGrup">Curs:</label>
          <select id="selectGrup" class="form-control">
            <option value="">-- Selecciona Curs --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="selectModul">Mòdul:</label>
          <select id="selectModul" class="form-control" disabled>
            <option value="">-- Selecciona Mòdul --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="selectUF">Unitat Formativa (UF):</label>
          <select id="selectUF" class="form-control" disabled>
            <option value="">-- Selecciona UF --</option>
          </select>
        </div>

        <div class="form-group" id="containerHores">
          <label for="inputHores">Durada de la sessió (Hores):</label>
          <select id="inputHores" class="form-control">
            <option value="1">1 hora</option>
            <option value="1.5">1 hora i mitja</option>
            <option value="2" selected>2 hores</option>
            <option value="2.5">2 hores i mitja</option>
            <option value="3">3 hores</option>
          </select>
        </div>

        <button type="button" id="btnCarregar" class="btn btn-secondary">Carregar Alumnes</button>
      </div>

      <!-- Missatge informatiu quan es carreguin registres anteriors -->
      <div id="infoModeContainer" class="alert-info" style="display: none; margin: 15px 0; padding: 10px; border-radius: 6px; background-color: #e8f4f8; color: #1d6f8a; font-weight: 500;"></div>

      <!-- Llista d'Alumnes -->
      <div id="alumnesContainer" class="students-list"></div>

      <!-- Botó Acció (Guardar / Actualitzar) -->
      <div class="action-bar">
        <button type="button" id="btnGuardar" class="btn btn-success" style="display: none;">Guardar Assistència</button>
      </div>
    <!-- Tot el teu HTML actual de targetes, selectores i llista d'alumnes -->
  </div>

<!-- OVERLAY / SPINNER GLOBAL DE CÀRREGA -->
<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-card">
    <div class="spinner"></div>
    <p id="loading-text" class="loading-text">Carregant dades...</p>
    <p id="loading-subtext" class="loading-subtext"></p>

    <!-- Contenidor de Logs per veure el progrés -->
    <div class="loading-logs">
      <div id="log-messages" class="log-messages"></div>
    </div>
  </div>
</div>

<style>
  /* Estils per a la pantalla de càrrega */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.5); /* Fons fosc semitransparent */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Es mostra per sobre de tot */
    backdrop-filter: blur(2px);
  }

  .loading-overlay.hidden {
    display: none !important;
  }

  .loading-card {
    background: #ffffff;
    padding: 25px 35px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 280px;
    max-width: 400px;
    width: 90%;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db; /* Color principal de l'spinner */
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    font-family: sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #333333;
    margin: 0;
    text-align: center;
  }

  .loading-subtext {
    font-family: sans-serif;
    font-size: 0.85rem;
    color: #666666;
    margin: 0;
    text-align: center;
  }

  /* Àrea de missatges de logs */
  .loading-logs {
    width: 100%;
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 8px;
    max-height: 110px;
    overflow-y: auto;
    text-align: left;
    font-size: 0.8rem;
    font-family: monospace;
    box-sizing: border-box;
    margin-top: 5px;
  }

  .log-messages p {
    margin: 3px 0;
    color: #475569;
  }

  .log-messages p.success {
    color: #16a34a;
    font-weight: bold;
  }

  .log-messages p.highlight {
    color: #2563eb;
    font-weight: bold;
  }
</style>

  <script src="script.js"></script>
</body>
</html>
